<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>알바수첩 - 근무표</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#111111" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>전체 근무표</h1>
      <button class="btn-link" onclick="logout()">로그아웃</button>
    </div>

    <p class="hint" style="margin-bottom:16px;">모든 근무자가 함께 볼 수 있어요.</p>

    <div id="adminAddWrap" style="display:none; margin-bottom:16px;">
      <a href="shift-form.html"><button class="btn-primary">+ 근무 기록 추가</button></a>
    </div>

    <div id="list" style="overflow-x:auto;">
      <table id="scheduleTable" style="width:100%; border-collapse:collapse; font-size:14px;">
        <thead style="background-color:#f5f5f5; font-weight:600; border-bottom:2px solid #ddd;">
          <tr>
            <th style="padding:12px; text-align:left; border-right:1px solid #eee;">날짜</th>
            <th style="padding:12px; text-align:left; border-right:1px solid #eee;">근무자</th>
            <th style="padding:12px; text-align:center; border-right:1px solid #eee;">시간</th>
            <th style="padding:12px; text-align:center; border-right:1px solid #eee;">급여</th>
            <th style="padding:12px; text-align:center;">메모</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="5" style="text-align:center; padding:20px;">불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>

    <div id="pagination" style="display:flex; justify-content:center; align-items:center; gap:12px; margin-top:20px; padding-bottom:20px;">
      <button class="btn-outline" onclick="previousPage()" id="prevBtn">← 이전</button>
      <span id="pageInfo" style="font-weight:600;">1 / 1</span>
      <button class="btn-outline" onclick="nextPage()" id="nextBtn">다음 →</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html">홈</a>
    <a href="schedule.html" class="active">근무표</a>
    <a href="calendar.html">달력</a>
    <a href="my-pay.html">알바비</a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentIsAdmin = false;
    let allSchedules = [];
    let payrollMap = {};
    let currentPage = 1;
    const itemsPerPage = 30;

    requireLogin(async (profile) => {
      currentIsAdmin = isAdminUsername(profile.username);
      if (currentIsAdmin) document.getElementById("adminAddWrap").style.display = "block";
      await loadSchedules();
    });

    async function loadSchedules() {
      const snap = await db.collection("schedules").orderBy("date", "desc").limit(500).get();

      if (snap.empty) {
        document.getElementById("tableBody").innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px; color:#999;">등록된 근무 기록이 아직 없어요.</td></tr>`;
        document.getElementById("pagination").style.display = "none";
        return;
      }

      // payroll 데이터 함께 가져오기
      const payrollSnap = await db.collection("payroll").get();
      payrollMap = {};
      payrollSnap.forEach((doc) => {
        payrollMap[doc.id] = doc.data();
      });

      // 모든 데이터 배열에 저장
      allSchedules = [];
      snap.forEach((doc) => {
        allSchedules.push({ id: doc.id, ...doc.data() });
      });

      currentPage = 1;
      displayPage(1);
    }

    function displayPage(pageNum) {
      const start = (pageNum - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const pageData = allSchedules.slice(start, end);

      const tbody = document.getElementById("tableBody");
      let html = "";

      pageData.forEach((doc) => {
        const s = doc;
        const p = payrollMap[doc.id];
        const totalPay = p ? p.totalPay : 0;
        const timeDisplay = s.startTime && s.endTime ? `${s.startTime} ~ ${s.endTime}` : "(예정)";

        html += `
          <tr style="border-bottom:1px solid #eee; hover:background-color:#f9f9f9;">
            <td style="padding:12px; border-right:1px solid #eee;">${formatDateKr(s.date)}</td>
            <td style="padding:12px; border-right:1px solid #eee;">${escapeHtml(s.workerName)}</td>
            <td style="padding:12px; text-align:center; border-right:1px solid #eee;">${timeDisplay}</td>
            <td style="padding:12px; text-align:center; font-weight:600; color:#111; border-right:1px solid #eee;">${totalPay > 0 ? formatWon(totalPay) : "-"}</td>
            <td style="padding:12px; text-align:center;">
              ${s.memo ? `<span style="font-size:12px; color:#666;">${escapeHtml(s.memo)}</span>` : "-"}
              ${currentIsAdmin ? `<br/><a href="shift-form.html?id=${doc.id}" style="font-size:12px; color:#0066cc;">수정</a>` : ""}
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;

      // 페이지 정보 업데이트
      const totalPages = Math.ceil(allSchedules.length / itemsPerPage);
      document.getElementById("pageInfo").textContent = `${pageNum} / ${totalPages}`;

      // 이전/다음 버튼 활성화 상태
      document.getElementById("prevBtn").disabled = pageNum === 1;
      document.getElementById("nextBtn").disabled = pageNum === totalPages;

      document.getElementById("prevBtn").style.opacity = pageNum === 1 ? "0.5" : "1";
      document.getElementById("nextBtn").style.opacity = pageNum === totalPages ? "0.5" : "1";
    }

    function previousPage() {
      if (currentPage > 1) {
        currentPage--;
        displayPage(currentPage);
        window.scrollTo(0, 0);
      }
    }

    function nextPage() {
      const totalPages = Math.ceil(allSchedules.length / itemsPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        displayPage(currentPage);
        window.scrollTo(0, 0);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }
  </script>
</body>
</html>
