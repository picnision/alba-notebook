<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>알바수첩 - 근무 기록</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#111111" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1 id="pageTitle">근무 기록 추가</h1>
      <a href="schedule.html"><button class="btn-link">닫기</button></a>
    </div>

    <form id="shiftForm">
      <div class="form-group">
        <label>근무자</label>
        <select id="workerSelect" required>
          <option value="">근무자를 선택하세요</option>
        </select>
      </div>

      <div class="form-group">
        <label>날짜</label>
        <input type="date" id="dateInput" required />
      </div>

      <div class="form-group">
        <label>근무 상태</label>
        <select id="statusSelect" required>
          <option value="">상태를 선택하세요</option>
          <option value="planned">예정</option>
          <option value="completed">실제 근무</option>
        </select>
      </div>

      <div id="timeSection" style="display:none;">
      <div class="form-row">
        <div class="form-group">
          <label>출근 시간</label>
          <div style="display:flex; gap:4px; align-items:center;">
            <select id="startHour" style="flex:1;">
              <option value="">시간</option>
            </select>
            <span style="font-weight:bold;">:</span>
            <select id="startMinute" style="flex:1;">
              <option value="">분</option>
              <option value="00">00</option>
              <option value="30">30</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>퇴근 시간</label>
          <div style="display:flex; gap:4px; align-items:center;">
            <select id="endHour" style="flex:1;">
              <option value="">시간</option>
            </select>
            <span style="font-weight:bold;">:</span>
            <select id="endMinute" style="flex:1;">
              <option value="">분</option>
              <option value="00">00</option>
              <option value="30">30</option>
            </select>
          </div>
        </div>
      </div>
      <p class="hint" id="hoursHint" style="margin-top:-10px; margin-bottom:18px;">휴게시간 없이 계산돼요.</p>

      <div class="form-group">
        <label>기본 알바비 (원)</label>
        <div style="display:flex; gap:8px;">
          <input type="number" id="basePayInput" min="0" step="10" required style="flex:1;" />
          <button type="button" class="btn-secondary btn-small" onclick="autoCalcBasePay()">자동계산</button>
        </div>
        <p class="hint">출근/퇴근 시간을 입력한 후 '자동계산' 버튼을 누르면 근무시간 × 기본급으로 자동 계산됩니다.</p>
      </div>

      <div class="form-group">
        <label>추가근무 알바비 (원, 없으면 0)</label>
        <input type="number" id="extraPayInput" min="0" step="10" value="0" />
      </div>
      </div>

      <div class="form-group">
        <label>메모 (선택)</label>
        <textarea id="memoInput" rows="2" placeholder="예: 야간 대타, 재고 정리 등"></textarea>
      </div>

      <button type="submit" class="btn-primary" style="margin-bottom:10px;">저장</button>
      <button type="button" id="deleteBtn" class="btn-danger" style="display:none;">이 근무 기록 삭제</button>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    let workersMap = {}; // uid -> {name, username, defaultHourlyWage}
    let editId = new URLSearchParams(location.search).get("id"); // 수정 모드면 값 있음

    // 시간 옵션 생성 (00~23)
    function initializeTimeSelects() {
      const startHour = document.getElementById('startHour');
      const endHour = document.getElementById('endHour');

      for (let i = 0; i < 24; i++) {
        const hour = String(i).padStart(2, '0');
        startHour.appendChild(new Option(hour, hour));
        endHour.appendChild(new Option(hour, hour));
      }
    }

    // 시간/분을 HH:MM 형식으로 변환
    function getTimeFromSelects(hourSelect, minuteSelect) {
      const hour = hourSelect.value;
      const minute = minuteSelect.value;
      if (!hour || !minute) return '';
      return `${hour}:${minute}`;
    }

    // 시간을 시간/분으로 분리해서 select 설정
    function setTimeToSelects(time, hourSelect, minuteSelect) {
      if (!time) return;
      const [hours, minutes] = time.split(':');
      hourSelect.value = hours;
      minuteSelect.value = minutes;
    }

    initializeTimeSelects();

    // 근무 상태 선택 시 시간/알바비 필드 표시/숨김
    document.getElementById('statusSelect').addEventListener('change', (e) => {
      const timeSection = document.getElementById('timeSection');
      const basePayInput = document.getElementById('basePayInput');
      const isCompleted = e.target.value === 'completed';

      // 실제 근무일 때만 시간/알바비 필드 표시
      timeSection.style.display = isCompleted ? 'block' : 'none';
      basePayInput.required = isCompleted;

      if (isCompleted) {
        // 완료 상태로 변경될 때 현재 근무자의 기본급 자동 입력
        const workerUid = document.getElementById("workerSelect").value;
        const worker = workersMap[workerUid];
        if (worker) {
          document.getElementById("basePayInput").value = worker.defaultHourlyWage || 0;
        }
      } else {
        // 예정 상태일 때 시간/알바비 필드 초기화
        document.getElementById('startHour').value = '';
        document.getElementById('startMinute').value = '';
        document.getElementById('endHour').value = '';
        document.getElementById('endMinute').value = '';
        document.getElementById('basePayInput').value = '';
        document.getElementById('extraPayInput').value = '0';
        document.getElementById('hoursHint').textContent = '휴게시간 없이 계산돼요.';
      }
    });

    requireLogin(async (profile) => {
      if (!isAdminUsername(profile.username)) {
        alert("관리자만 접근할 수 있는 페이지예요.");
        window.location.href = "home.html";
        return;
      }
      await loadWorkerOptions();
      if (editId) {
        document.getElementById("pageTitle").textContent = "근무 기록 수정";
        document.getElementById("deleteBtn").style.display = "block";
        await loadExistingShift(editId);
      } else {
        // 새 등록: 오늘 날짜 기본값
        document.getElementById("dateInput").value = toDateStr(new Date());
        // 출근 시간 기본값 10:00 설정
        document.getElementById("startHour").value = "10";
        document.getElementById("startMinute").value = "00";
      }
    });

    async function loadWorkerOptions() {
      const snap = await db.collection("users").orderBy("name", "asc").get();
      const select = document.getElementById("workerSelect");
      select.innerHTML = '<option value="">근무자를 선택하세요</option>';
      snap.forEach((doc) => {
        const u = doc.data();
        workersMap[doc.id] = u;
        const opt = document.createElement("option");
        opt.value = doc.id;
        opt.textContent = `${u.name} (${u.username})`;
        select.appendChild(opt);
      });

      // 근무자 선택 시 기본급 자동 채우기
      select.addEventListener("change", () => {
        const worker = workersMap[select.value];
        if (worker && editId) { // 수정 모드일 때만 기본급 설정
          document.getElementById("basePayInput").value = worker.defaultHourlyWage || 0;
        } else if (worker && !editId && document.getElementById("statusSelect").value === "completed") {
          // 새 등록이고 상태가 "실제 근무"일 때만 기본급 설정
          document.getElementById("basePayInput").value = worker.defaultHourlyWage || 0;
        }
      });
    }

    async function loadExistingShift(id) {
      const [scheduleSnap, payrollSnap] = await Promise.all([
        db.collection("schedules").doc(id).get(),
        db.collection("payroll").doc(id).get(),
      ]);
      if (!scheduleSnap.exists) {
        alert("근무 기록을 찾을 수 없어요.");
        window.location.href = "schedule.html";
        return;
      }
      const s = scheduleSnap.data();
      const p = payrollSnap.exists ? payrollSnap.data() : {};

      document.getElementById("workerSelect").value = s.workerUid;
      document.getElementById("dateInput").value = s.date;
      document.getElementById("statusSelect").value = s.status || "completed";
      document.getElementById("memoInput").value = s.memo || "";

      // status에 따라 필드 표시/숨김
      const timeSection = document.getElementById("timeSection");
      const basePayInput = document.getElementById("basePayInput");
      const isCompleted = (s.status || "completed") === "completed";
      timeSection.style.display = isCompleted ? 'block' : 'none';
      basePayInput.required = isCompleted;

      // 시간과 급여 정보 로드
      if (s.startTime) setTimeToSelects(s.startTime, document.getElementById("startHour"), document.getElementById("startMinute"));
      if (s.endTime) setTimeToSelects(s.endTime, document.getElementById("endHour"), document.getElementById("endMinute"));
      document.getElementById("basePayInput").value = p.basePay || 0;
      document.getElementById("extraPayInput").value = p.extraPay || 0;
    }

    function autoCalcBasePay() {
      const start = getTimeFromSelects(document.getElementById("startHour"), document.getElementById("startMinute"));
      const end = getTimeFromSelects(document.getElementById("endHour"), document.getElementById("endMinute"));
      const workerUid = document.getElementById("workerSelect").value;
      const worker = workersMap[workerUid];
      const wage = worker?.defaultHourlyWage || 0;

      if (!start || !end) {
        alert("출근/퇴근 시간을 먼저 입력해주세요.");
        return;
      }
      if (wage === 0) {
        alert("근무자의 기본급이 설정되지 않았어요. 근무자 기본급 설정 페이지에서 먼저 설정해주세요.");
        return;
      }
      const hours = calcHours(start, end);
      document.getElementById("basePayInput").value = Math.round(hours * wage);
      document.getElementById("hoursHint").textContent = `근무시간: ${hours}시간 (기본급: ${formatWon(wage)}/시간)`;
    }

    document.getElementById("shiftForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const workerUid = document.getElementById("workerSelect").value;
      const worker = workersMap[workerUid];
      if (!worker) {
        alert("근무자를 선택해주세요.");
        return;
      }

      const date = document.getElementById("dateInput").value;
      const status = document.getElementById("statusSelect").value;
      const memo = document.getElementById("memoInput").value.trim();
      const id = editId || db.collection("schedules").doc().id;

      const scheduleData = {
        workerUid,
        workerName: worker.name,
        workerUsername: worker.username,
        workerDisplayOrder: worker.displayOrder || 999,
        date,
        status,
        memo,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      };

      // 실제 근무인 경우에만 시간과 급여 정보 추가
      if (status === "completed") {
        const startTime = getTimeFromSelects(document.getElementById("startHour"), document.getElementById("startMinute"));
        const endTime = getTimeFromSelects(document.getElementById("endHour"), document.getElementById("endMinute"));
        if (!startTime || !endTime) {
          alert("출근/퇴근 시간을 모두 입력해주세요.");
          return;
        }

        const hourlyWage = worker.defaultHourlyWage || 0;
        const basePay = Number(document.getElementById("basePayInput").value) || 0;
        const extraPay = Number(document.getElementById("extraPayInput").value) || 0;

        const hours = calcHours(startTime, endTime);
        const weekStart = getWeekStart(date);

        scheduleData.startTime = startTime;
        scheduleData.endTime = endTime;

        const payrollData = {
          workerUid,
          workerName: worker.name,
          workerUsername: worker.username,
          date,
          weekStart,
          hourlyWage,
          hours,
          basePay,
          extraPay,
          totalPay: basePay + extraPay,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        };

        const batch = db.batch();
        batch.set(db.collection("schedules").doc(id), scheduleData, { merge: true });
        batch.set(db.collection("payroll").doc(id), payrollData, { merge: true });

        try {
          console.log("실제 근무 저장 중:", scheduleData, payrollData);
          await batch.commit();
          console.log("저장 완료!");
          window.location.href = "schedule.html";
        } catch (err) {
          console.error("저장 에러:", err);
          alert("저장에 실패했어요: " + err.message);
        }
      } else {
        // 예정 상태: schedules 컬렉션에만 저장
        try {
          console.log("예정 상태 저장 중:", scheduleData);
          await db.collection("schedules").doc(id).set(scheduleData, { merge: true });
          console.log("저장 완료!");
          window.location.href = "schedule.html";
        } catch (err) {
          console.error("저장 에러:", err);
          alert("저장에 실패했어요: " + err.message);
        }
      }
    });

    document.getElementById("deleteBtn").addEventListener("click", async () => {
      if (!confirm("이 근무 기록을 정말 삭제할까요? 되돌릴 수 없어요.")) return;
      const batch = db.batch();
      batch.delete(db.collection("schedules").doc(editId));
      batch.delete(db.collection("payroll").doc(editId));
      try {
        await batch.commit();
        window.location.href = "schedule.html";
      } catch (err) {
        alert("삭제에 실패했어요: " + err.message);
      }
    });
  </script>
</body>
</html>
