<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>알바수첩</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#111111" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .auth-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--gray-100);
  }
  .auth-tabs button {
    flex: 1;
    padding: 14px 0;
    border: none;
    background: none;
    font-size: 15px;
    font-weight: 600;
    color: var(--gray-500);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }
  .auth-tabs button.active {
    color: var(--black);
    border-bottom-color: var(--black);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>
<body class="center-page">
  <div class="login-card">
    <h1>알바수첩</h1>
    <p class="subtitle">근무표와 알바비를 한눈에 확인하세요</p>

    <div class="auth-tabs">
      <button class="tab-btn active" data-tab="login">로그인</button>
      <button class="tab-btn" data-tab="signup">회원가입</button>
    </div>

    <!-- 로그인 탭 -->
    <div id="login" class="tab-content active">
      <form id="loginForm">
        <div class="form-group">
          <label>아이디</label>
          <input type="text" id="loginUsername" placeholder="아이디 입력" required />
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호 입력" required />
        </div>
        <button type="submit" class="btn-primary">로그인</button>
        <p id="loginError" class="hint" style="color:#c0392b; display:none; margin-top:12px;"></p>
      </form>
    </div>

    <!-- 회원가입 탭 -->
    <div id="signup" class="tab-content">
      <form id="signupForm">
        <div class="form-group">
          <label>아이디 <span class="hint" style="font-weight:normal;">(중복 불가)</span></label>
          <input type="text" id="signupUsername" placeholder="아이디 입력" required />
          <p id="usernameCheck" class="hint" style="display:none;"></p>
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="signupPassword" placeholder="비밀번호 입력" required />
          <p class="hint">자유롭게 설정하세요</p>
        </div>
        <div class="form-group">
          <label>이름 (선택)</label>
          <input type="text" id="signupName" placeholder="이름 입력 (선택사항)" />
        </div>
        <button type="submit" class="btn-primary">가입하기</button>
        <p id="signupError" class="hint" style="color:#c0392b; display:none; margin-top:12px;"></p>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    // 탭 전환
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(tab).classList.add('active');
      });
    });

    // 로그인
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';

      try {
        const snap = await db.collection('users').where('username', '==', username).get();
        if (snap.empty) {
          errEl.textContent = '아이디가 존재하지 않아요.';
          errEl.style.display = 'block';
          return;
        }

        const user = snap.docs[0].data();
        if (user.password !== password) {
          errEl.textContent = '비밀번호가 틀렸어요.';
          errEl.style.display = 'block';
          return;
        }

        // 로그인 성공 - 로컬스토리지에 저장
        localStorage.setItem('albaUsername', username);
        localStorage.setItem('albaUserId', snap.docs[0].id);
        window.location.href = 'home.html';
      } catch (err) {
        errEl.textContent = '로그인 실패: ' + err.message;
        errEl.style.display = 'block';
      }
    });

    // 아이디 중복 체크
    document.getElementById('signupUsername').addEventListener('blur', async (e) => {
      const username = e.target.value.trim();
      const checkEl = document.getElementById('usernameCheck');

      if (!username) {
        checkEl.style.display = 'none';
        return;
      }

      try {
        const snap = await db.collection('users').where('username', '==', username).get();
        if (snap.empty) {
          checkEl.textContent = '✓ 사용 가능한 아이디예요';
          checkEl.style.color = '#27ae60';
          checkEl.style.display = 'block';
        } else {
          checkEl.textContent = '✗ 이미 사용 중인 아이디예요';
          checkEl.style.color = '#c0392b';
          checkEl.style.display = 'block';
        }
      } catch (err) {
        checkEl.style.display = 'none';
      }
    });

    // 회원가입
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('signupPassword').value;
      const name = document.getElementById('signupName').value.trim() || username;
      const errEl = document.getElementById('signupError');
      errEl.style.display = 'none';

      if (!username || !password) {
        errEl.textContent = '아이디와 비밀번호는 필수예요.';
        errEl.style.display = 'block';
        return;
      }

      try {
        // 중복 체크
        const snap = await db.collection('users').where('username', '==', username).get();
        if (!snap.empty) {
          errEl.textContent = '이미 사용 중인 아이디예요.';
          errEl.style.display = 'block';
          return;
        }

        // 새 사용자 생성
        const newUserRef = db.collection('users').doc();
        await newUserRef.set({
          username,
          password,
          name,
          email: '',
          defaultHourlyWage: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // 로그인 처리
        localStorage.setItem('albaUsername', username);
        localStorage.setItem('albaUserId', newUserRef.id);
        window.location.href = 'home.html';
      } catch (err) {
        errEl.textContent = '가입 실패: ' + err.message;
        errEl.style.display = 'block';
      }
    });

    // 이미 로그인했으면 홈으로
    if (localStorage.getItem('albaUsername')) {
      window.location.href = 'home.html';
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
