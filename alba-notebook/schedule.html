<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>알바수첩 - 근무표</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#111111" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>전체 근무표</h1>
      <button class="btn-link" onclick="logout()">로그아웃</button>
    </div>

    <p class="hint" style="margin-bottom:16px;">모든 근무자가 함께 볼 수 있어요. (알바비 금액은 표시되지 않습니다)</p>

    <div id="adminAddWrap" style="display:none; margin-bottom:16px;">
      <a href="shift-form.html"><button class="btn-primary">+ 근무 기록 추가</button></a>
    </div>

    <div id="list"><div class="loading">불러오는 중...</div></div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html">홈</a>
    <a href="schedule.html" class="active">근무표</a>
    <a href="calendar.html">달력</a>
    <a href="my-pay.html">알바비</a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentIsAdmin = false;

    requireLogin(async (profile) => {
      currentIsAdmin = isAdminUsername(profile.username);
      if (currentIsAdmin) document.getElementById("adminAddWrap").style.display = "block";
      await loadSchedules();
    });

    async function loadSchedules() {
      const listEl = document.getElementById("list");
      const snap = await db.collection("schedules").orderBy("date", "desc").limit(100).get();

      if (snap.empty) {
        listEl.innerHTML = `<div class="empty-state">등록된 근무 기록이 아직 없어요.</div>`;
        return;
      }

      let html = `<div class="card">`;
      snap.forEach((doc) => {
        const s = doc.data();
        html += `
          <div class="shift-item">
            <div class="shift-date">${formatDateKr(s.date)}</div>
            <div class="shift-main">
              <div class="shift-worker">${escapeHtml(s.workerName)}</div>
              <div class="shift-time">${s.startTime} ~ ${s.endTime}${s.memo ? " · " + escapeHtml(s.memo) : ""}</div>
            </div>
            ${
              currentIsAdmin
                ? `<div class="shift-actions">
                    <a href="shift-form.html?id=${doc.id}"><button class="btn-outline btn-small">수정</button></a>
                   </div>`
                : ""
            }
          </div>
        `;
      });
      html += `</div>`;
      listEl.innerHTML = html;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }
  </script>
</body>
</html>
