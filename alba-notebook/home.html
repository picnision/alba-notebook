<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>알바수첩 - 홈</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#111111" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>알바수첩</h1>
      <div style="display:flex; gap:8px;">
        <button class="btn-link" onclick="openPasswordModal()">비밀번호 변경</button>
        <button class="btn-link" onclick="logout()">로그아웃</button>
      </div>
    </div>

    <div id="greeting" class="hint" style="font-size:14px; margin-bottom:16px;"></div>

    <div id="summaryArea"></div>

    <div id="adminActions" style="display:none;">
      <div class="section-title">관리자 메뉴</div>
      <a href="shift-form.html"><button class="btn-primary" style="margin-bottom:10px;">+ 근무 기록 추가</button></a>
      <a href="workers.html"><button class="btn-secondary" style="margin-bottom:10px;">근무자 기본급 설정</button></a>
    </div>

    <div class="section-title">바로가기</div>
    <a href="calendar.html"><button class="btn-outline" style="margin-bottom:10px;">근무 달력 보기</button></a>
    <a href="schedule.html"><button class="btn-outline" style="margin-bottom:10px;">전체 근무표 보기</button></a>
    <a href="my-pay.html"><button class="btn-outline">알바비 확인</button></a>
  </div>

  <!-- 비밀번호 변경 모달 -->
  <div id="passwordModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:flex-end; justify-content:center;">
    <div style="width:100%; background:white; border-radius:16px 16px 0 0; padding:24px; box-sizing:border-box; max-height:80vh; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0;">비밀번호 변경</h2>
        <button class="btn-link" onclick="closePasswordModal()" style="font-size:20px;">✕</button>
      </div>

      <form id="passwordForm" style="display:flex; flex-direction:column; gap:16px;">
        <div class="form-group">
          <label>현재 비밀번호</label>
          <input type="password" id="currentPassword" placeholder="현재 비밀번호 입력" required />
        </div>

        <div class="form-group">
          <label>새 비밀번호</label>
          <input type="password" id="newPassword" placeholder="새 비밀번호 입력" required />
          <p class="hint">4자 이상 입력해주세요</p>
        </div>

        <div class="form-group">
          <label>새 비밀번호 확인</label>
          <input type="password" id="confirmPassword" placeholder="새 비밀번호 재입력" required />
        </div>

        <div id="passwordError" class="hint" style="color:#c0392b; display:none;"></div>

        <div style="display:flex; gap:8px;">
          <button type="submit" class="btn-primary" style="flex:1;">변경</button>
          <button type="button" class="btn-secondary" style="flex:1;" onclick="closePasswordModal()">취소</button>
        </div>
      </form>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="active">홈</a>
    <a href="schedule.html">근무표</a>
    <a href="calendar.html">달력</a>
    <a href="my-pay.html">알바비</a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentUserId = null;
    let currentPassword = null;

    function openPasswordModal() {
      const modal = document.getElementById("passwordModal");
      modal.style.display = "flex";
      document.getElementById("passwordForm").reset();
      document.getElementById("passwordError").style.display = "none";
    }

    function closePasswordModal() {
      document.getElementById("passwordModal").style.display = "none";
    }

    document.getElementById("passwordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("passwordError");
      errorEl.style.display = "none";

      const currentPwd = document.getElementById("currentPassword").value;
      const newPwd = document.getElementById("newPassword").value;
      const confirmPwd = document.getElementById("confirmPassword").value;

      // 검증
      if (currentPwd !== currentPassword) {
        errorEl.textContent = "현재 비밀번호가 일치하지 않습니다.";
        errorEl.style.display = "block";
        return;
      }

      if (newPwd.length < 4) {
        errorEl.textContent = "새 비밀번호는 4자 이상이어야 합니다.";
        errorEl.style.display = "block";
        return;
      }

      if (newPwd !== confirmPwd) {
        errorEl.textContent = "새 비밀번호가 일치하지 않습니다.";
        errorEl.style.display = "block";
        return;
      }

      if (newPwd === currentPwd) {
        errorEl.textContent = "새 비밀번호는 현재 비밀번호와 달라야 합니다.";
        errorEl.style.display = "block";
        return;
      }

      try {
        // Firestore에서 비밀번호 업데이트
        await db.collection("users").doc(currentUserId).update({
          password: newPwd,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("비밀번호가 변경되었습니다.");
        currentPassword = newPwd; // 로컬 변수 업데이트
        closePasswordModal();
      } catch (err) {
        errorEl.textContent = "비밀번호 변경에 실패했습니다: " + err.message;
        errorEl.style.display = "block";
      }
    });

    requireLogin(async (profile) => {
      currentUserId = profile.uid;

      // 현재 비밀번호 로드
      const userDoc = await db.collection("users").doc(profile.uid).get();
      if (userDoc.exists) {
        currentPassword = userDoc.data().password;
      }
      const isAdmin = isAdminUsername(profile.username);
      document.getElementById("greeting").textContent =
        `${profile.name}님, 안녕하세요${isAdmin ? " (관리자)" : ""}.`;

      if (isAdmin) {
        document.getElementById("adminActions").style.display = "block";
      }

      // 이번 주(월~일) 알바비 요약 카드 - 관리자가 아닌 경우에만 개인 요약 표시
      if (!isAdmin) {
        const todayStr = toDateStr(new Date());
        const weekStart = getWeekStart(todayStr);
        const snap = await db
          .collection("payroll")
          .where("workerUsername", "==", profile.username)
          .where("weekStart", "==", weekStart)
          .get();

        let total = 0;
        snap.forEach((doc) => (total += doc.data().totalPay || 0));

        document.getElementById("summaryArea").innerHTML = `
          <div class="summary-card">
            <div class="label">이번 주 (${formatWeekRange(weekStart)}) 알바비</div>
            <div class="amount">${formatWon(total)}</div>
            <div class="range">주 단위(월~일) 합계 · 자세히는 '알바비' 탭에서 확인</div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
