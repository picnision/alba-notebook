<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>알바수첩 - 근무자 관리</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#111111" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>근무자 관리</h1>
      <a href="home.html"><button class="btn-link">닫기</button></a>
    </div>

    <p class="hint" style="margin-bottom:16px;">
      아래에서 각 근무자의 기본급을 설정하고 표시 순서를 정할 수 있습니다. 순서는 근무 기록 추가 페이지에서 사용됩니다.
    </p>

    <div id="list"><div class="loading">불러오는 중...</div></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireLogin(async (profile) => {
      if (!isAdminUsername(profile.username)) {
        alert("관리자만 접근할 수 있는 페이지예요.");
        window.location.href = "home.html";
        return;
      }
      await loadWorkers();
    });

    async function loadWorkers() {
      const listEl = document.getElementById("list");
      const snap = await db.collection("users").orderBy("name", "asc").get();

      if (snap.empty) {
        listEl.innerHTML = `<div class="empty-state">등록된 사용자가 없어요.</div>`;
        return;
      }

      let html = "";
      snap.forEach((doc) => {
        const u = doc.data();
        const admin = isAdminUsername(u.username);
        html += `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <div>
                <div style="font-weight:700;">${escapeHtml(u.name)} ${admin ? '<span class="badge badge-admin">관리자</span>' : ""}</div>
                <div class="hint">${escapeHtml(u.username)}</div>
              </div>
            </div>
            <div class="form-row" style="align-items:flex-end; gap:8px;">
              <div class="form-group" style="margin-bottom:0; flex:1;">
                <label>기본급 (원)</label>
                <input type="number" min="0" step="10" id="wage-${doc.id}" value="${u.defaultHourlyWage || 0}" />
              </div>
              <div class="form-group" style="margin-bottom:0; width:80px;">
                <label>순서</label>
                <input type="number" min="1" id="order-${doc.id}" value="${u.displayOrder || 999}" />
              </div>
              <button class="btn-secondary btn-small" style="height:46px;" onclick="saveWorker('${doc.id}')">저장</button>
              ${!admin ? `<button class="btn-danger btn-small" style="height:46px;" onclick="deleteWorker('${doc.id}', '${escapeHtml(u.name)}')">삭제</button>` : ""}
            </div>
          </div>
        `;
      });
      listEl.innerHTML = html;
    }

    async function saveWorker(uid) {
      const wage = Number(document.getElementById(`wage-${uid}`).value) || 0;
      const order = Number(document.getElementById(`order-${uid}`).value) || 999;
      await db.collection("users").doc(uid).update({
        defaultHourlyWage: wage,
        displayOrder: order
      });
      alert("저장했어요.");
      await loadWorkers(); // 순서 변경 후 다시 로드
    }

    async function deleteWorker(uid, workerName) {
      if (!confirm(`${workerName}을(를) 정말 삭제할까요? 이 근무자와 관련된 모든 근무 기록과 알바비 기록도 함께 삭제됩니다. 되돌릴 수 없어요.`)) {
        return;
      }

      try {
        const batch = db.batch();

        // 1. 사용자 삭제
        batch.delete(db.collection("users").doc(uid));

        // 2. 이 근무자와 관련된 모든 근무 기록 삭제
        const scheduleSnap = await db.collection("schedules").where("workerUid", "==", uid).get();
        scheduleSnap.forEach((doc) => {
          batch.delete(db.collection("schedules").doc(doc.id));
        });

        // 3. 이 근무자와 관련된 모든 알바비 기록 삭제
        const payrollSnap = await db.collection("payroll").where("workerUid", "==", uid).get();
        payrollSnap.forEach((doc) => {
          batch.delete(db.collection("payroll").doc(doc.id));
        });

        await batch.commit();
        alert("근무자를 삭제했어요.");
        await loadWorkers();
      } catch (err) {
        console.error("삭제 에러:", err);
        alert("삭제에 실패했어요: " + err.message);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }
  </script>
</body>
</html>
