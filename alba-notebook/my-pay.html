<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>알바수첩 - 알바비</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#111111" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>알바비</h1>
      <button class="btn-link" onclick="logout()">로그아웃</button>
    </div>

    <div id="adminSwitcher" style="display:none; margin-bottom:16px;">
      <div class="form-group" style="margin-bottom:10px;">
        <label>확인할 근무자</label>
        <select id="workerPicker"></select>
      </div>
    </div>

    <!-- 주/월 토글 -->
    <div style="display:flex; gap:8px; margin-bottom:16px;">
      <button id="weekToggleBtn" class="btn-secondary" style="flex:1; background:#000; color:#fff;" onclick="switchToWeek()">주 단위</button>
      <button id="monthToggleBtn" class="btn-secondary" style="flex:1;" onclick="switchToMonth()">월 단위</button>
    </div>

    <!-- 주 단위 네비게이션 -->
    <div id="weekSelector" style="display:none; margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <button class="btn-secondary btn-small" onclick="previousWeek()">← 이전 주</button>
        <span id="weekDisplay" style="font-weight:600; flex:1; text-align:center;"></span>
        <button class="btn-secondary btn-small" onclick="nextWeek()">다음 주 →</button>
      </div>
    </div>

    <!-- 월 단위 네비게이션 -->
    <div id="monthSelector" style="display:none; margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <button class="btn-secondary btn-small" onclick="previousMonth()">← 이전 달</button>
        <span id="monthDisplay" style="font-weight:600; flex:1; text-align:center;"></span>
        <button class="btn-secondary btn-small" onclick="nextMonth()">다음 달 →</button>
      </div>
    </div>

    <div id="content"><div class="loading">불러오는 중...</div></div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html">홈</a>
    <a href="schedule.html">근무표</a>
    <a href="calendar.html">달력</a>
    <a href="my-pay.html" class="active">알바비</a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentWeek = toDateStr(new Date());
    let currentMonth = toDateStr(new Date()).slice(0, 7); // "YYYY-MM" 형식
    let currentUsername = null;
    let viewMode = "week"; // "week" 또는 "month"

    function updateViewMode(mode) {
      viewMode = mode;
      document.getElementById("weekToggleBtn").style.background = mode === "week" ? "#000" : "#ccc";
      document.getElementById("weekToggleBtn").style.color = mode === "week" ? "#fff" : "#000";
      document.getElementById("monthToggleBtn").style.background = mode === "month" ? "#000" : "#ccc";
      document.getElementById("monthToggleBtn").style.color = mode === "month" ? "#fff" : "#000";

      document.getElementById("weekSelector").style.display = mode === "week" ? "block" : "none";
      document.getElementById("monthSelector").style.display = mode === "month" ? "block" : "none";
    }

    function switchToWeek() {
      updateViewMode("week");
      updateWeekDisplay();
      refreshPayDisplay();
    }

    function switchToMonth() {
      updateViewMode("month");
      updateMonthDisplay();
      refreshPayDisplay();
    }

    requireLogin(async (profile) => {
      const isAdmin = isAdminUsername(profile.username);
      currentUsername = profile.username;
      currentWeek = getWeekStart(currentUsername === "__ALL__" ? toDateStr(new Date()) : toDateStr(new Date()));
      currentMonth = toDateStr(new Date()).slice(0, 7);

      updateViewMode("week");
      updateWeekDisplay();

      if (isAdmin) {
        document.getElementById("adminSwitcher").style.display = "block";
        await setupAdminSwitcher();
      } else {
        await renderWorkerPayWeek(profile.username, currentWeek);
      }
    });

    function updateWeekDisplay() {
      document.getElementById("weekDisplay").textContent = formatWeekRange(currentWeek);
    }

    async function previousWeek() {
      const [year, month, day] = currentWeek.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      date.setDate(date.getDate() - 7);
      currentWeek = getWeekStart(toDateStr(date));
      updateWeekDisplay();
      await refreshPayDisplay();
    }

    async function nextWeek() {
      const [year, month, day] = currentWeek.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      date.setDate(date.getDate() + 7);
      currentWeek = getWeekStart(toDateStr(date));
      updateWeekDisplay();
      await refreshPayDisplay();
    }

    async function refreshPayDisplay() {
      if (viewMode === "week") {
        if (currentUsername === "__ALL__") {
          await renderAllWorkersWeek(currentWeek);
        } else {
          await renderWorkerPayWeek(currentUsername, currentWeek);
        }
      } else {
        if (currentUsername === "__ALL__") {
          await renderAllWorkersMonth(currentMonth);
        } else {
          await renderWorkerPayMonth(currentUsername, currentMonth);
        }
      }
    }

    function updateMonthDisplay() {
      const [year, month] = currentMonth.split("-");
      const monthNames = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"];
      document.getElementById("monthDisplay").textContent = `${year}년 ${monthNames[Number(month) - 1]}`;
    }

    function previousMonth() {
      const [year, month] = currentMonth.split("-").map(Number);
      const date = new Date(year, month - 2, 1); // month는 1부터 시작하므로 -2
      date.setMonth(date.getMonth() - 1);
      currentMonth = toDateStr(date).slice(0, 7);
      updateMonthDisplay();
      refreshPayDisplay();
    }

    function nextMonth() {
      const [year, month] = currentMonth.split("-").map(Number);
      const date = new Date(year, month - 1, 1);
      date.setMonth(date.getMonth() + 1);
      currentMonth = toDateStr(date).slice(0, 7);
      updateMonthDisplay();
      refreshPayDisplay();
    }

    async function setupAdminSwitcher() {
      const snap = await db.collection("users").orderBy("name", "asc").get();
      const picker = document.getElementById("workerPicker");
      const optAll = document.createElement("option");
      optAll.value = "__ALL__";
      optAll.textContent = "전체 (이번 주 요약)";
      picker.appendChild(optAll);

      snap.forEach((doc) => {
        const u = doc.data();
        const opt = document.createElement("option");
        opt.value = u.username;
        opt.textContent = u.name;
        picker.appendChild(opt);
      });

      picker.addEventListener("change", () => {
        currentUsername = picker.value;
        currentWeek = getWeekStart(toDateStr(new Date()));
        updateWeekDisplay();
        if (picker.value === "__ALL__") renderAllWorkersWeek(currentWeek);
        else renderWorkerPayWeek(picker.value, currentWeek);
      });

      // 초기값 설정: "전체" 선택
      currentUsername = "__ALL__";
      picker.value = "__ALL__";
      await renderAllWorkersWeek(currentWeek);
    }

    async function renderAllWorkersWeek(weekStart) {
      const contentEl = document.getElementById("content");
      contentEl.innerHTML = `<div class="loading">불러오는 중...</div>`;

      const snap = await db.collection("payroll").where("weekStart", "==", weekStart).get();

      const byWorker = {};
      snap.forEach((doc) => {
        const p = doc.data();
        if (!byWorker[p.workerUsername]) {
          byWorker[p.workerUsername] = { name: p.workerName, base: 0, extra: 0, hours: 0 };
        }
        byWorker[p.workerUsername].base += p.basePay || 0;
        byWorker[p.workerUsername].extra += p.extraPay || 0;
        byWorker[p.workerUsername].hours += p.hours || 0;
      });

      const rows = Object.values(byWorker);
      if (rows.length === 0) {
        contentEl.innerHTML = `<div class="empty-state">이번 주(${formatWeekRange(weekStart)}) 등록된 근무 기록이 없어요.</div>`;
        return;
      }

      let html = `<div class="section-title">이번 주 (${formatWeekRange(weekStart)}) 근무자별 합계</div>`;
      rows
        .sort((a, b) => b.base + b.extra - (a.base + a.extra))
        .forEach((r) => {
          html += `
            <div class="week-card">
              <div class="week-header">
                <span style="font-weight:700;">${escapeHtml(r.name)}</span>
                <span class="week-total">${formatWon(r.base + r.extra)}</span>
              </div>
              <div class="pay-breakdown">
                <span>근무 ${r.hours}시간</span>
                <span>기본 ${formatWon(r.base)}</span>
                <span>추가 ${formatWon(r.extra)}</span>
              </div>
            </div>
          `;
        });
      contentEl.innerHTML = html;
    }

    async function renderWorkerPayWeek(username, weekStart) {
      const contentEl = document.getElementById("content");
      contentEl.innerHTML = `<div class="loading">불러오는 중...</div>`;

      const snap = await db
        .collection("payroll")
        .where("workerUsername", "==", username)
        .where("weekStart", "==", weekStart)
        .orderBy("date", "desc")
        .get();

      if (snap.empty) {
        contentEl.innerHTML = `<div class="empty-state">${formatWeekRange(weekStart)} 등록된 알바비 기록이 없어요.</div>`;
        return;
      }

      const items = [];
      let base = 0, extra = 0, hours = 0;
      snap.forEach((doc) => {
        const p = doc.data();
        items.push(p);
        base += p.basePay || 0;
        extra += p.extraPay || 0;
        hours += p.hours || 0;
      });

      const total = base + extra;
      let html = `
        <div class="week-card">
          <div class="week-header">
            <span class="week-range">${formatWeekRange(weekStart)}</span>
            <span class="week-total">${formatWon(total)}</span>
          </div>
          <div class="pay-breakdown">
            <span>근무 ${hours}시간</span>
            <span>기본 ${formatWon(base)}</span>
            <span>추가 ${formatWon(extra)}</span>
          </div>
          <details>
            <summary>일별 내역 보기</summary>
            ${items
              .sort((a, b) => (a.date < b.date ? 1 : -1))
              .map(
                (it) => `
              <div style="padding:12px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-weight:600; margin-bottom:4px;">${formatDateKr(it.date)}</div>
                  <div style="font-size:12px; color:#666;">
                    ${formatWon(it.hourlyWage)}/시간 × ${it.hours}시간${it.extraPay > 0 ? ` + 추가급 ${formatWon(it.extraPay)}` : ''}
                  </div>
                </div>
                <div style="text-align:right;">
                  <div style="font-weight:700; font-size:16px;">${formatWon(it.basePay + it.extraPay)}</div>
                  <div style="font-size:12px; color:#666; margin-top:2px;">
                    기본 ${formatWon(it.basePay)}${it.extraPay > 0 ? ` + ${formatWon(it.extraPay)}` : ''}
                  </div>
                </div>
              </div>
            `
              )
              .join("")}
          </details>
        </div>
      `;

      contentEl.innerHTML = html;
    }

    async function renderAllWorkersMonth(monthStr) {
      const contentEl = document.getElementById("content");
      contentEl.innerHTML = `<div class="loading">불러오는 중...</div>`;

      const [year, month] = monthStr.split("-").map(Number);
      const firstDay = `${year}-${String(month).padStart(2, "0")}-01`;
      const lastDay = `${year}-${String(month).padStart(2, "0")}-${new Date(year, month, 0).getDate()}`;

      const snap = await db
        .collection("payroll")
        .where("date", ">=", firstDay)
        .where("date", "<=", lastDay)
        .get();

      const byWorker = {};
      snap.forEach((doc) => {
        const p = doc.data();
        if (!byWorker[p.workerUsername]) {
          byWorker[p.workerUsername] = { name: p.workerName, base: 0, extra: 0, hours: 0 };
        }
        byWorker[p.workerUsername].base += p.basePay || 0;
        byWorker[p.workerUsername].extra += p.extraPay || 0;
        byWorker[p.workerUsername].hours += p.hours || 0;
      });

      const rows = Object.values(byWorker);
      if (rows.length === 0) {
        const monthNames = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"];
        contentEl.innerHTML = `<div class="empty-state">${year}년 ${monthNames[month - 1]} 등록된 근무 기록이 없어요.</div>`;
        return;
      }

      const monthNames = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"];
      let html = `<div class="section-title">${year}년 ${monthNames[month - 1]} 근무자별 합계</div>`;
      rows
        .sort((a, b) => b.base + b.extra - (a.base + a.extra))
        .forEach((r) => {
          html += `
            <div class="week-card">
              <div class="week-header">
                <span style="font-weight:700;">${escapeHtml(r.name)}</span>
                <span class="week-total">${formatWon(r.base + r.extra)}</span>
              </div>
              <div class="pay-breakdown">
                <span>근무 ${r.hours}시간</span>
                <span>기본 ${formatWon(r.base)}</span>
                <span>추가 ${formatWon(r.extra)}</span>
              </div>
            </div>
          `;
        });
      contentEl.innerHTML = html;
    }

    async function renderWorkerPayMonth(username, monthStr) {
      const contentEl = document.getElementById("content");
      contentEl.innerHTML = `<div class="loading">불러오는 중...</div>`;

      const [year, month] = monthStr.split("-").map(Number);
      const firstDay = `${year}-${String(month).padStart(2, "0")}-01`;
      const lastDay = `${year}-${String(month).padStart(2, "0")}-${new Date(year, month, 0).getDate()}`;

      const snap = await db
        .collection("payroll")
        .where("workerUsername", "==", username)
        .where("date", ">=", firstDay)
        .where("date", "<=", lastDay)
        .orderBy("date", "desc")
        .get();

      if (snap.empty) {
        const monthNames = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"];
        contentEl.innerHTML = `<div class="empty-state">${year}년 ${monthNames[month - 1]} 등록된 알바비 기록이 없어요.</div>`;
        return;
      }

      const items = [];
      let base = 0, extra = 0, hours = 0;
      snap.forEach((doc) => {
        const p = doc.data();
        items.push(p);
        base += p.basePay || 0;
        extra += p.extraPay || 0;
        hours += p.hours || 0;
      });

      const total = base + extra;
      const monthNames = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"];
      let html = `
        <div class="week-card">
          <div class="week-header">
            <span class="week-range">${year}년 ${monthNames[month - 1]}</span>
            <span class="week-total">${formatWon(total)}</span>
          </div>
          <div class="pay-breakdown">
            <span>근무 ${hours}시간</span>
            <span>기본 ${formatWon(base)}</span>
            <span>추가 ${formatWon(extra)}</span>
          </div>
          <details>
            <summary>일별 내역 보기</summary>
            ${items
              .map(
                (it) => `
              <div style="padding:12px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-weight:600; margin-bottom:4px;">${formatDateKr(it.date)}</div>
                  <div style="font-size:12px; color:#666;">
                    ${formatWon(it.hourlyWage)}/시간 × ${it.hours}시간${it.extraPay > 0 ? ` + 추가급 ${formatWon(it.extraPay)}` : ''}
                  </div>
                </div>
                <div style="text-align:right;">
                  <div style="font-weight:700; font-size:16px;">${formatWon(it.basePay + it.extraPay)}</div>
                  <div style="font-size:12px; color:#666; margin-top:2px;">
                    기본 ${formatWon(it.basePay)}${it.extraPay > 0 ? ` + ${formatWon(it.extraPay)}` : ''}
                  </div>
                </div>
              </div>
            `
              )
              .join("")}
          </details>
        </div>
      `;

      contentEl.innerHTML = html;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }
  </script>
</body>
</html>
